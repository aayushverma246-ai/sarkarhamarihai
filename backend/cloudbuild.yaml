steps:
  # ── Step 1: Build the optimized production Docker image ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:latest'
      - '.'

  # ── Step 2: Push the unique commit-hash tag to Artifact Registry ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:$COMMIT_SHA'

  # ── Step 3: Push the 'latest' release tag to Artifact Registry ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:latest'

  # ── Step 4: Deploy keyless to Google Cloud Run ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sarkar-backend-api'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:$COMMIT_SHA'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Mount production secrets securely from Secret Manager
      - '--set-secrets'
      - 'DATABASE_URL=sarkar-database-url:latest,JWT_SECRET=sarkar-jwt-secret:latest,GEMINI_API_KEY_NEW=sarkar-gemini-key:latest'
      # Configure dynamic environment parameters
      - '--set-env-vars'
      - 'USE_VERTEX_AI=true,GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=$_LOCATION'

# Image references generated by this build
images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/sarkar-backend:$COMMIT_SHA'

# Deployment defaults (can be overridden during build execution)
substitutions:
  _LOCATION: 'us-central1'
  _REPOSITORY: 'sarkar-app'

# Stream build logs directly to GCP Cloud Logging
options:
  logging: CLOUD_LOGGING_ONLY
